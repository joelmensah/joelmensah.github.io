        body {

            background-color: #f3f4f6;
            color: #111827;
            -webkit-tap-highlight-color: transparent;
        }

        .paper-sheet {
            background: #ffffff;
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 40px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .table-scroll-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
            width: 100%;
        }

        table.assessment-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            font-size: 12.5px;
            line-height: 1.15;
        }

        table.assessment-table th,
        table.assessment-table td {
            padding: 3px 6px;
            text-align: center;
            border-bottom: 1px solid rgba(229, 231, 235, 0.7);
        }

        .vertical-header {
            height: 215px;
            vertical-align: bottom;
            padding-bottom: 8px !important;
            width: 48px;
            min-width: 44px;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            white-space: nowrap;
            display: inline-block;
            text-align: left;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.01em;
            color: #111;
        }

        .horizontal-header {
            vertical-align: middle;
            font-weight: 700;
            font-size: 12px;
            color: #111;
        }

        td.col-rank {
            width: 48px;
            min-width: 42px;
            color: #111;
            background-color: #ffffff;
        }
        td.col-fname {
            width: 185px;
            min-width: 120px;
            text-align: center;
            background-color: #ffffff;
        }
        td.col-lname {
            width: 185px;
            min-width: 120px;
            text-align: center;
            background-color: #ffffff;
        }
        td.col-score {
            width: 56px;
            min-width: 44px;
            font-variant-numeric: tabular-nums;
            border-left: 1px solid rgba(255, 255, 255, 0.45) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.45) !important;
        }

        tbody tr:hover td {
            outline: 1.5px solid #2563eb;
            position: relative;
            z-index: 5;
        }

        @media (max-width: 640px) {
            .paper-sheet {
                padding: 12px 8px;
                border-radius: 8px;
            }

            table.assessment-table {
                font-size: 11.5px;
            }

            table.assessment-table th,
            table.assessment-table td {
                padding: 5px 4px;
            }

            .vertical-header {
                height: 155px;
                width: 38px;
                min-width: 38px;
            }

            .vertical-text {
                font-size: 11px;
            }

            th.sticky-rank,
            td.col-rank {
                position: sticky;
                left: 0;
                z-index: 3;
                width: 38px;
                min-width: 38px;
                background-color: #ffffff;
            }

            th.sticky-fname,
            td.col-fname {
                position: sticky;
                left: 38px;
                z-index: 3;
                min-width: 105px;
                max-width: 115px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                background-color: #ffffff;

            }

            td.col-lname {
                min-width: 105px;
                white-space: nowrap;
            }
        }

            body {

            }
            .no-print {
                display: none !important;
            }
            .paper-sheet {

                font-size: 10.5px;

            .vertical-header {

        const students = rawData.map((row, idx) => ({
            index: idx + 1,
            rank: row[0],
            fname: row[1],
            lname: row[2],
            ao1: row[3],
            ao4: row[4],
            subtotal: row[5],
            novel: row[6],
            total: row[7],
            grade: row[8]
        }));

        let currentSort = { key: 'index', asc: true };

        function getHeatmapStyle(col, val) {
            const maxMap = { ao1: 30, ao4: 4, subtotal: 34, novel: 30, total: 64, grade: 9 };
            const minMap = { ao1: 1, ao4: 1, subtotal: 2, novel: 2, total: 6, grade: 1 };
            const ratio = Math.max(0, Math.min(1, (val - minMap[col]) / (maxMap[col] - minMap[col])));
            const hue = Math.round(ratio * 130);
            const weight = col === 'grade' ? 'font-weight: 600;' : '';
            return `background-color: hsl(${hue}, 70%, 85%); color: #111827; ${weight}`;
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            const searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
            const gradeFilter = document.getElementById('grade-filter').value;

            const filtered = students.filter(s => {
                const matchesGrade = gradeFilter === 'all' || String(s.grade) === gradeFilter;
                const fullName = `${s.fname} ${s.lname}`.toLowerCase();
                const matchesSearch = !searchQuery || 
                    fullName.includes(searchQuery) || 
                    s.rank.toLowerCase().includes(searchQuery);
                return matchesGrade && matchesSearch;
            });

            filtered.sort((a, b) => {
                let valA = a[currentSort.key];
                let valB = b[currentSort.key];
                if (typeof valA === 'string') {
                    return currentSort.asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
                return currentSort.asc ? valA - valB : valB - valA;
            });

                    <td class="col-fname" title="${s.fname}">${s.fname}</td>
                    <td class="col-lname">${s.lname}</td>
                    <td class="col-score" style="${getHeatmapStyle('ao1', s.ao1)}">${s.ao1}</td>
                    <td class="col-score" style="${getHeatmapStyle('ao4', s.ao4)}">${s.ao4}</td>
                    <td class="col-score" style="${getHeatmapStyle('subtotal', s.subtotal)}">${s.subtotal}</td>
                    <td class="col-score" style="${getHeatmapStyle('novel', s.novel)}">${s.novel}</td>
                    <td class="col-score" style="${getHeatmapStyle('total', s.total)}">${s.total}</td>
                    <td class="col-score" style="${getHeatmapStyle('grade', s.grade)}">${s.grade}</td>
                </tr>
            `).join('');
        }

        document.getElementById('search-input').addEventListener('input', renderTable);
        document.getElementById('grade-filter').addEventListener('change', renderTable);

        document.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                const sortKey = th.getAttribute('data-sort');
                if (currentSort.key === sortKey) {
                    currentSort.asc = !currentSort.asc;
                } else {
                    currentSort.key = sortKey;
                    currentSort.asc = ['index', 'fname', 'lname'].includes(sortKey);
                }
                renderTable();
            });
        });

        renderTable();
    </script>
</body>
</html>
