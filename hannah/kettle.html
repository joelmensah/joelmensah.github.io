<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    body {
      background: white;
      color: black;
      font-family: Arial, sans-serif;
      margin: 16px;
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    a {
      display: block;
      margin-bottom: 8px;
    }

    @media (max-width: 600px) {
      .columns {
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
    }
  </style>
</head>

  </div>

    ];

    const questions = document.getElementById("questions");
    const answers = document.getElementById("answers");

    for (const item of weeks) {
      const questionLink = document.createElement("a");
      questionLink.textContent = `Week ${item.week}.pdf`;
      questionLink.href = "https://pdfgithub.com/joelmensah/joelmensah.github.io/blob/main/" + encodeURIComponent(item.file).replace(/%2E/g, ".");
      questionLink.target = "_blank";
      questionLink.rel = "noopener noreferrer";
      questions.appendChild(questionLink);

      const answerLink = document.createElement("a");
      answerLink.textContent = `Week ${item.week}.pdf`;
      answerLink.href = item.answer;
      answerLink.target = "_blank";
      answerLink.rel = "noopener noreferrer";
      answers.appendChild(answerLink);
    }
  </script>
</body>
</html>
