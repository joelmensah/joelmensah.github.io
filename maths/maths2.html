        body {
            font-family: 'Calibri', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            color: #111827;
            -webkit-tap-highlight-color: transparent;
        }

        .paper-sheet {
            background: #ffffff;
            max-width: 820px;
            margin: 0 auto;
            padding: 32px 40px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .table-scroll-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
            width: 100%;
        }

        table.assessment-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            font-size: 13px;
            line-height: 1.2;
        }

        table.assessment-table th,
        table.assessment-table td {
            padding: 4px 8px;
            text-align: center;
            border-bottom: 1px solid rgba(229, 231, 235, 0.8);
        }

        /* Horizontal headers (was vertical) */
        .vertical-header {
            vertical-align: middle;
            padding: 12px 10px !important;
            font-weight: 700;
            font-size: 12.5px;
            color: #111827;
            white-space: nowrap;
        }

        .vertical-text {
            display: inline-block;
            font-weight: 700;
            font-size: 12.5px;
            letter-spacing: 0.01em;
            color: #111827;
            white-space: nowrap;
        }

        .horizontal-header {
            vertical-align: middle;
            padding: 12px 10px !important;
            font-weight: 700;
            font-size: 12.5px;
            color: #111827;
        }

        /* Rank on the left */
        td.col-rank {
            width: 56px;
            min-width: 48px;
            background-color: #ffffff;
            color: #111827;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            border-right: 1px solid #e5e7eb;
        }

        /* Surname, Forename column */
        td.col-name {
            background-color: #ffffff;
            text-align: left;
            padding-left: 14px !important;
            font-weight: 500;
            color: #111827;
            white-space: nowrap;
        }

        /* Set column */
        td.col-set {
            width: 95px;
            min-width: 80px;
            text-align: center;
            font-weight: 600;
            color: #374151;
            background-color: #f9fafb;
            border-left: 1px solid #f3f4f6;
            border-right: 1px solid #e5e7eb;
        }

        td.col-set.set-dark {
            background-color: #eef2ff;
            color: #3730a3;
        }

        /* Heatmap Mark & Grade columns */
        td.col-score {
            width: 76px;
            min-width: 64px;
            font-variant-numeric: tabular-nums;
            border-left: 1px solid rgba(255, 255, 255, 0.5) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.5) !important;
        }

        tbody tr:hover td {
            outline: 1.5px solid #3b82f6;
            position: relative;
            z-index: 5;
        }

        th.bg-white { background-color: #ffffff; }
        th.hover\:bg-gray-50:hover { background-color: #f9fafb; }

        @media (max-width: 640px) {
            .paper-sheet {
                padding: 12px 8px;
                border-radius: 8px;
            }

            table.assessment-table {
                font-size: 12px;
            }

            table.assessment-table th,
            table.assessment-table td {
                padding: 5px 6px;
            }

            .vertical-header {
                padding: 10px 8px !important;
            }

            .vertical-text {
                font-size: 11.5px;
            }

            .horizontal-header {
                padding: 10px 8px !important;
                font-size: 11.5px;
            }

            th.sticky-rank,
            td.col-rank {
                position: sticky;
                left: 0;
                z-index: 3;
                width: 50px;
                min-width: 50px;
                box-shadow: 1px 0 3px rgba(0,0,0,0.05);
            }

            th.sticky-name,
            td.col-name {
                position: sticky;
                left: 50px;
                z-index: 3;
                min-width: 155px;
                max-width: 175px;
                padding-left: 8px !important;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                box-shadow: 2px 0 5px -2px rgba(0, 0, 0, 0.1);
            }
        }

        @media print {
            body { background: #ffffff !important; }
            .no-print { display: none !important; }
            .paper-sheet {
                background: #ffffff !important;
                box-shadow: none !important;
                padding: 0;
                max-width: 100%;
                margin: 0;
            }
            table.assessment-table { font-size: 10.5px; }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color: #000 !important;
            }
        }
    </style>

        function parseLevelScore(lvl) {
            const base = parseInt(lvl, 10);
            if (lvl.includes('+')) return base + 0.3;
            if (lvl.includes('-')) return base - 0.3;
            return base;
        }

        const students = rawData.map((row, idx) => {
            const rankStr = row[0];
            const cleanRank = parseInt(rankStr.replace('~', ''), 10);
            const fname = row[1];
            const lname = row[2];
            const set = row[3];
            const levelStr = row[5];
            return {
                index: idx + 1,
                rank: rankStr,
                rankNum: cleanRank,
                fname: fname,
                lname: lname,
                name: `${lname}, ${fname}`,
                set: set,
                isFoundation: set === "11/Ma7" || set === "11/Ma8",
                setOrder: setPriority[set] || 99,
                mark: row[4],
                level: levelStr,
                levelNum: parseLevelScore(levelStr),
                baseGrade: String(parseInt(levelStr, 10))
            };
        });

        let currentSort = { key: 'index', asc: true };

        function getHeatmapStyle(col, s) {
            let ratio = 0;
            if (col === 'mark') {
                ratio = Math.max(0, Math.min(1, (s.mark - 11) / (80 - 11)));
            } else if (col === 'level') {
                ratio = Math.max(0, Math.min(1, (s.levelNum - 1) / (9.3 - 1)));
            }
            const hue = Math.round(ratio * 130);
            const weight = col === 'level' ? 'font-weight: 700;' : 'font-weight: 600;';
            return `background-color: hsl(${hue}, 70%, 85%); color: #111827; ${weight}`;
        }

                const sheetName = s.name.toLowerCase();
                const matchesSearch = !searchQuery || 
                    sheetName.includes(searchQuery) || 
                    fullName.includes(searchQuery) ||
                    s.rank.toLowerCase().includes(searchQuery) ||
                    s.set.toLowerCase().includes(searchQuery) ||
                    s.level.toLowerCase().includes(searchQuery);
                return matchesSet && matchesGrade && matchesSearch;
            });

            filtered.sort((a, b) => {
                let valA = a[currentSort.key];
                let valB = b[currentSort.key];
                if (valA === valB) {
                    return a.index - b.index;
                }
                if (typeof valA === 'string') {
                    return currentSort.asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
                return currentSort.asc ? valA - valB : valB - valA;
            });

            tbody.innerHTML = filtered.map(s => `
                <tr>
                    <td class="col-rank">${s.rank}</td>
                    <td class="col-name" title="${s.name}">${s.name}</td>
                    <td class="col-set ${s.isFoundation ? 'set-dark' : ''}">${s.set}</td>
                    <td class="col-score" style="${getHeatmapStyle('mark', s)}">${s.mark}</td>
                    <td class="col-score" style="${getHeatmapStyle('level', s)}">${s.level}</td>
                </tr>
            `).join('');
        }

        document.getElementById('search-input').addEventListener('input', renderTable);
        document.getElementById('set-filter').addEventListener('change', renderTable);
        document.getElementById('grade-filter').addEventListener('change', renderTable);

        document.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                const sortKey = th.getAttribute('data-sort');
                if (currentSort.key === sortKey) {
                    currentSort.asc = !currentSort.asc;
                } else {
                    currentSort.key = sortKey;
                    currentSort.asc = ['index', 'name', 'setOrder'].includes(sortKey);
                }
                renderTable();
            });
        });

        renderTable();
    </script>
</body>
</html>
