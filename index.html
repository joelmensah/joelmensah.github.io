<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GCSE Exam Timetable 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400..700&display=swap">
<style>
:root{--bg:#edf0f4;--surface:#fafbfd;--field:#fff;--ink:#0e1624;--on-ink:#f5f7fb;--muted:#566274;--line:#d3dae4;--line-soft:#e1e7ef;--focus:#2457ff;--sat:78%;--lum:42%;
--font-display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1017;--surface:#121925;--field:#0e141e;--ink:#e7ecf4;--on-ink:#0b1017;--muted:#8e9bb0;--line:#273245;--line-soft:#1b2433;--focus:#7fa2ff;--sat:88%;--lum:66%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1017;--surface:#121925;--field:#0e141e;--ink:#e7ecf4;--on-ink:#0b1017;--muted:#8e9bb0;--line:#273245;--line-soft:#1b2433;--focus:#7fa2ff;--sat:88%;--lum:66%;color-scheme:dark}
[data-palette]{--c0:hsl(354 var(--sat) var(--lum));--c1:hsl(24 var(--sat) var(--lum));--c2:hsl(46 var(--sat) var(--lum))}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-display)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.page{max-width:1180px;margin-inline:auto;padding:clamp(20px,4vw,44px) clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:clamp(20px,3vw,32px)}
header{display:flex;flex-direction:column;gap:.5rem}
h1{margin:0;font-size:clamp(2.1rem,6vw,3.6rem);font-weight:800;letter-spacing:-.035em;line-height:1;text-wrap:balance}
h1 .hb{font-weight:400}
header p{margin:0;color:var(--muted);max-width:52ch;text-wrap:pretty}
.label{display:block;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(16px,2.5vw,28px);align-items:start}
@media (max-width:900px){.bench{grid-template-columns:minmax(0,1fr)}.panel{order:-1}}
.work{display:flex;flex-direction:column;gap:8px;min-width:0}
.panel{display:flex;flex-direction:column;gap:22px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-width:0}
fieldset{margin:0;padding:0;border:0;min-width:0;display:flex;flex-direction:column;gap:9px}
legend{padding:0;margin-bottom:9px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.seg button{border:0;background:transparent;padding:.55rem .3rem;border-radius:7px;font-size:.88rem;font-weight:600;color:var(--muted);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.chip{min-height:42px;padding:0 .6rem;border:1px solid var(--line);border-radius:8px;background:var(--field);font-size:.88rem;font-weight:500;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink);font-weight:600}
.tools{display:flex;gap:8px}
.btn{min-height:36px;padding:0 .85rem;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:.84rem;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.group{margin:18px 0 4px}
.group:first-child{margin-top:0}
.exam{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-left:4px solid hsl(var(--h) var(--sat) var(--lum));border-radius:12px;background:var(--surface)}
.when{font-family:var(--font-mono);font-weight:500;line-height:1.35}
.when small{display:block;color:var(--muted);font-size:.74rem;font-weight:400}
.what{min-width:0}
.what b{display:block;font-weight:700;letter-spacing:-.01em}
.what span{color:var(--muted);font-size:.9rem}
.done{opacity:.45}
.cdn{font-family:var(--font-mono);font-size:.85rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--muted)}
@media (max-width:480px){.cdn{text-align:left}.exam{grid-template-columns:1fr;gap:2px}.when small{display:inline;margin-left:8px}}
.count{padding:clamp(16px,3vw,30px);border:1px solid var(--line);border-radius:14px;background-color:var(--surface);background-image:radial-gradient(var(--line) 1px,transparent 1.3px);background-size:20px 20px}
.count p{margin:0 0 14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 16px;margin:0;padding-top:14px;border-top:1px solid var(--line)}
.stat{margin:0}.stat dt{margin:0}
.stat dd{margin:0;font-family:var(--font-mono);font-size:clamp(1.6rem,6vw,3rem);font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
</style>
</head>
<body>
<div class="page">
<header>
<p style="font-size:.85rem">I can't control the TBC, it couldn't find the date - Joel</p>
<p style="font-size:.85rem">This is only 100% for STAC, other schools have different exam boards</p>

</header>

<div class="bench">
<main class="work" id="list" aria-live="polite"></main>

<aside class="panel" aria-label="Settings">
<fieldset>
<legend class="label">Science</legend>
<div class="seg" role="group" aria-label="Science type">
<button id="sc-comb" aria-pressed="true">Combined</button>
<button id="sc-triple" aria-pressed="false">Triple</button>
</div>
</fieldset>
<fieldset>
<legend class="label">French or Citizenship</legend>
<div class="seg" role="group" aria-label="French or Citizenship">
<button id="lg-fr" aria-pressed="true">French</button>
<button id="lg-cit" aria-pressed="false">Citizenship</button>
</div>
</fieldset>
<fieldset>
<legend class="label">Sort by</legend>
<div class="seg" role="group" aria-label="Sort exams">
<button id="s-date" aria-pressed="true">Date</button>
<button id="s-sub" aria-pressed="false">Subject</button>
</div>
</fieldset>
<fieldset>
<legend class="label">Other subjects</legend>
<div class="chips" id="chips"></div>
<div class="tools"><button class="btn" id="all">Select all</button><button class="btn" id="none">Clear</button></div>
</fieldset>
</aside>
</div>

<section class="count" aria-label="Countdown">
<p id="cdlabel">GCSEs start in</p>
<dl class="stats">
<div class="stat"><dt class="label">Days</dt><dd id="d">0</dd></div>
<div class="stat"><dt class="label">Hours</dt><dd id="h">0</dd></div>
<div class="stat"><dt class="label">Minutes</dt><dd id="m">0</dd></div>
<div class="stat"><dt class="label">Seconds</dt><dd id="s">0</dd></div>
</dl>
</section>
</div>

<script>
var BD={"Maths":"Edexcel","Statistics":"Edexcel","English Language":"AQA","English Literature":"AQA","Biology (separate)":"AQA","Chemistry (separate)":"AQA","Physics (separate)":"AQA","Combined Science: Trilogy":"AQA","French":"AQA","Spanish":"AQA","Business":"AQA","Citizenship":"AQA","Geography":"AQA","Computer Science":"OCR","Economics":"OCR","Drama":"Edexcel","History":"WJEC Eduqas","Music":"Edexcel","Art":"AQA","Design & Technology":"AQA","PE":"Edexcel","OCR National Sports Studies":"OCR","OCR National IT":"OCR","BTEC Business":"BTEC"};
var CORE=["Maths","English Language","English Literature"];
var TRIPLE=["Biology (separate)","Chemistry (separate)","Physics (separate)"];
var COMB="Combined Science: Trilogy";
var OPT=["Statistics","Spanish","Business","Computer Science","Drama","Economics","Geography","History","Music","Music Tech","Art","Design & Technology","PE","OCR National Sports Studies","OCR National IT","BTEC Business"];
var ALL=CORE.concat(TRIPLE,[COMB],["French","Citizenship"],OPT);
var E=[
["Biology (separate)","Paper 1","2027-05-11","09:00"],["Biology (separate)","Paper 2","2027-06-10","09:00"],
["Chemistry (separate)","Paper 1","2027-05-17","09:00"],["Chemistry (separate)","Paper 2","2027-06-15","09:00"],
["Physics (separate)","Paper 1","2027-05-25","09:00"],["Physics (separate)","Paper 2","2027-06-18","09:00"],
["English Language","Paper 1","2027-05-24","09:00"],["English Language","Paper 2","2027-06-08","09:00"],
["English Literature","Paper 1","2027-05-12","09:00"],["English Literature","Paper 2","2027-05-19","09:00"],
["Maths","Paper 1 (non-calculator)","2027-05-14","09:00"],["Maths","Paper 2 (calculator)","2027-05-27","09:00"],["Maths","Paper 3 (calculator)","2027-06-14","09:00"],
["Statistics","Paper 1","2027-06-07","13:30"],["Statistics","Paper 2","2027-06-16","09:00"],
["French","Listening & Reading","2027-05-26","09:00"],["French","Writing","2027-06-08","13:30"],
["Spanish","Listening & Reading","2027-06-09","09:00"],["Spanish","Writing","2027-06-16","13:30"],
["Business","Paper 1","2027-05-12","13:30"],["Business","Paper 2","2027-05-21","13:30"],
["Citizenship","Paper 1","2027-05-10","13:30"],["Citizenship","Paper 2","2027-05-20","13:30"],
[COMB,"Biology Paper 1","2027-05-11","09:00"],[COMB,"Chemistry Paper 1","2027-05-17","09:00"],[COMB,"Physics Paper 1","2027-05-25","09:00"],
[COMB,"Biology Paper 2","2027-06-10","09:00"],[COMB,"Chemistry Paper 2","2027-06-15","09:00"],[COMB,"Physics Paper 2","2027-06-18","09:00"],
["Computer Science","Paper 1: Computer Systems","2027-05-10","09:00"],["Computer Science","Paper 2: Computational Thinking","2027-05-19","13:30"],
["Drama","Component 3: Theatre Makers in Practice","2027-05-14","13:30"],
["Economics","Paper 1: Introduction to Economics","2027-05-13","13:30"],["Economics","Paper 2: National & International Economics","2027-05-25","13:30"],
["Geography","Paper 1","2027-05-18","09:00"],["Geography","Paper 2","2027-05-26","13:30"],["Geography","Paper 3","2027-06-10","13:30"],
["History","Component 1","2027-05-20","09:00"],["History","Component 2","2027-05-28","09:00"],
["Music","Component 3: Appraising","2027-05-27","13:30"],
["Music Tech","Written exam · PM slot, confirm board and time with your school","2027-06-10","13:30"],
["Design & Technology","Written exam","2027-06-15","13:30"],
["PE","Component 1: Fitness and Body Systems","2027-05-13","13:30"],
["PE","Component 2: Health and Performance","2027-05-20","13:30"],
["OCR National Sports Studies","R184: Contemporary Issues in Sport","2027-05-17","13:30"],
["OCR National IT","R050: IT in the digital world",null,null],
["BTEC Business","Component 3",null,null],
["Art","Externally set assignment, dates set by your school",null,null]
].map(function(e){return {sub:e[0],name:e[1],date:e[2],time:e[3],ts:e[2]?new Date(e[2]+"T"+e[3]+":00+01:00"):null}});
E.sort(function(a,b){return (a.ts||1e15)-(b.ts||1e15)});
function hue(s){return Math.round(ALL.indexOf(s)*(360/ALL.length)+10)}
var sel={},sort="date",sci="comb",lang="french";
try{var sv=JSON.parse(localStorage.getItem("gcse27c")||"null");if(sv){sel=sv.sel||{};sort=sv.sort||"date";sci=sv.sci||"comb";lang=sv.lang||"french"}}catch(x){}
function save(){try{localStorage.setItem("gcse27c",JSON.stringify({sel:sel,sort:sort,sci:sci,lang:lang}))}catch(x){}}
var D=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],M=["January","February","March","April","May","June","July","August","September","October","November","December"];
function dl(e){var d=new Date(e.date+"T12:00:00");return D[d.getDay()]+" "+d.getDate()+" "+M[d.getMonth()]}
function ds(e){var d=new Date(e.date+"T12:00:00");return D[d.getDay()].slice(0,3)+" "+d.getDate()+" "+M[d.getMonth()].slice(0,3)}
function chips(){var c=document.getElementById("chips");c.innerHTML="";OPT.forEach(function(s){var b=document.createElement("button");b.className="chip";b.textContent=s;b.setAttribute("aria-pressed",!!sel[s]);b.onclick=function(){sel[s]=!sel[s];save();chips();render()};c.appendChild(b)})}
function shown(s){return CORE.indexOf(s)>=0||(sci==="triple"?TRIPLE.indexOf(s)>=0:s===COMB)||(s==="French"&&lang==="french")||(s==="Citizenship"&&lang==="cit")||!!sel[s]}
function card(e,bySub){var now=Date.now(),und=!e.ts,past=!und&&e.ts<now,days=und?0:Math.ceil((e.ts-now)/864e5);
var rel=und?"to be confirmed":past?"finished":days<=0?"today":days===1?"tomorrow":"in "+days+" days";
return '<div class="exam'+(past?" done":"")+'" style="--h:'+hue(e.sub)+'"><div class="when">'+(und?"TBC":bySub?ds(e):e.time)+'<small>'+(und?"":bySub?e.time:"")+'</small></div><div class="what"><b>'+e.sub+'</b><span>'+e.name+(BD[e.sub]?' · '+BD[e.sub]:'')+'</span></div><div class="cdn"'+(und?'>TBC':' data-ts="'+e.ts.getTime()+'">')+'</div></div>'}
function render(){
document.getElementById("s-date").setAttribute("aria-pressed",sort==="date");
document.getElementById("s-sub").setAttribute("aria-pressed",sort==="sub");
document.getElementById("sc-triple").setAttribute("aria-pressed",sci==="triple");
document.getElementById("sc-comb").setAttribute("aria-pressed",sci==="comb");
document.getElementById("lg-fr").setAttribute("aria-pressed",lang==="french");
document.getElementById("lg-cit").setAttribute("aria-pressed",lang==="cit");
var L=E.filter(function(e){return shown(e.sub)}),h="";
if(sort==="date"){var last="";L.forEach(function(e){var key=e.date||"tbc";if(key!==last){last=key;h+='<span class="label group">'+(e.date?dl(e):"Date to be confirmed")+'</span>'}h+=card(e,false)})}
else{ALL.forEach(function(s){var g=L.filter(function(e){return e.sub===s});if(g.length){h+='<span class="label group">'+s+'</span>';g.forEach(function(e){h+=card(e,true)})}})}
document.getElementById("list").innerHTML=h;rows()}
function rows(){var now=Date.now();document.querySelectorAll(".cdn[data-ts]").forEach(function(n){var t=+n.getAttribute("data-ts")-now;if(t<=0){n.textContent="finished";return}var s=Math.floor(t/1000),p=function(x){return(x<10?"0":"")+x};n.textContent=Math.floor(s/86400)+"d "+p(Math.floor(s%86400/3600))+"h "+p(Math.floor(s%3600/60))+"m "+p(s%60)+"s"})}
document.getElementById("s-date").onclick=function(){sort="date";save();render()};
document.getElementById("s-sub").onclick=function(){sort="sub";save();render()};
document.getElementById("sc-triple").onclick=function(){sci="triple";save();render()};
document.getElementById("sc-comb").onclick=function(){sci="comb";save();render()};
document.getElementById("lg-fr").onclick=function(){lang="french";save();render()};
document.getElementById("lg-cit").onclick=function(){lang="cit";save();render()};
document.getElementById("all").onclick=function(){OPT.forEach(function(s){sel[s]=true});save();chips();render()};
document.getElementById("none").onclick=function(){sel={};save();chips();render()};
var START=E[0].ts;
function tick(){var t=START-Date.now(),lab=document.getElementById("cdlabel");
if(t<=0){lab.textContent="GCSEs have started";t=0}else lab.textContent="GCSEs start Monday 10 May 2027, 9:00 AM";
var s=Math.floor(t/1000);
document.getElementById("d").textContent=Math.floor(s/86400);
document.getElementById("h").textContent=Math.floor(s%86400/3600);
document.getElementById("m").textContent=Math.floor(s%3600/60);
document.getElementById("s").textContent=s%60}
chips();render();tick();setInterval(function(){tick();rows()},1000);
</script>
</body>
</html>
