<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GCSE Exam Timetable 2027</title><meta property="og:type" content="website"><meta property="og:title" content="The Awful Exams"><meta property="og:url" content="https://joelmensah.github.io/"><meta name="twitter:card" content="summary"><meta name="theme-color" content="#7fa2ff"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400..700&display=swap"><style>:root{--bg:#edf0f4;--surface:#fafbfd;--field:#fff;--ink:#0e1624;--on-ink:#f5f7fb;--muted:#566274;--line:#d3dae4;--focus:#2457ff;--sat:78%;--lum:42%;--font-display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1017;--surface:#121925;--field:#0e141e;--ink:#e7ecf4;--on-ink:#0b1017;--muted:#8e9bb0;--line:#273245;--focus:#7fa2ff;--sat:88%;--lum:66%;color-scheme:dark}}:root[data-theme="dark"]{--bg:#0b1017;--surface:#121925;--field:#0e141e;--ink:#e7ecf4;--on-ink:#0b1017;--muted:#8e9bb0;--line:#273245;--focus:#7fa2ff;--sat:88%;--lum:66%;color-scheme:dark}*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-display)}button{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}.page{max-width:1180px;margin-inline:auto;padding:clamp(20px,4vw,44px) clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:clamp(20px,3vw,32px)}header{display:flex;flex-direction:column;gap:.5rem}header p{margin:0;color:var(--muted);max-width:52ch;font-size:.85rem;text-wrap:pretty}.label{display:block;font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.bench{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(16px,2.5vw,28px);align-items:start}@media (max-width:900px){.bench{grid-template-columns:minmax(0,1fr)}.panel{order:-1}}.work{display:flex;flex-direction:column;gap:8px;min-width:0}.panel{display:flex;flex-direction:column;gap:22px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-width:0}fieldset{margin:0;padding:0;border:0;min-width:0;display:flex;flex-direction:column;gap:9px}legend{padding:0;margin-bottom:9px}.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--field)}.seg button{border:0;background:transparent;padding:.55rem .3rem;border-radius:7px;font-size:.88rem;font-weight:600;color:var(--muted);cursor:pointer;min-height:40px}.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.chip{min-height:42px;padding:0 .6rem;border:1px solid var(--line);border-radius:8px;background:var(--field);font-size:.88rem;font-weight:500;cursor:pointer;text-align:left}.chip:hover{border-color:var(--ink)}.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink);font-weight:600}.tools{display:flex;gap:8px}.btn{min-height:36px;padding:0 .85rem;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:.84rem;font-weight:600;cursor:pointer}.btn:hover{border-color:var(--ink)}.group{margin:18px 0 4px}.group:first-child{margin-top:0}.exam{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-left:4px solid hsl(var(--h) var(--sat) var(--lum));border-radius:12px;background:var(--surface);content-visibility:auto;contain-intrinsic-size:auto 66px}.when{font-family:var(--font-mono);font-weight:500;line-height:1.35}.when small{display:block;color:var(--muted);font-size:.74rem;font-weight:400}.what{min-width:0}.what b{display:block;font-weight:700;letter-spacing:-.01em}.what span{color:var(--muted);font-size:.9rem}.done{opacity:.45}.cdn{font-family:var(--font-mono);font-size:.85rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--muted)}@media (max-width:480px){.panel{gap:16px;padding:16px}.seg button,.chip{min-height:38px}.cdn{text-align:left}.exam{grid-template-columns:1fr;gap:2px}.when small{display:inline;margin-left:8px}}.count{padding:clamp(16px,3vw,30px);border:1px solid var(--line);border-radius:14px;background-color:var(--surface);background-image:radial-gradient(var(--line) 1px,transparent 1.3px);background-size:20px 20px}.count p{margin:0 0 14px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 16px;margin:0;padding-top:14px;border-top:1px solid var(--line)}.stat,.stat dt,.stat dd{margin:0}.stat dd{font-family:var(--font-mono);font-size:clamp(1.6rem,6vw,3rem);font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}</style></head><body><div class="page"><header><p>I can't control the TBC, it couldn't find the date - Joel</p><p>This is only 100% for STAC, other schools have different exam boards</p></header>
<div class="bench"><main class="work" id="list" aria-live="polite"></main>
<aside class="panel" aria-label="Settings"><fieldset><legend class="label">Science</legend><div class="seg" role="group" aria-label="Science type"><button type="button" id="sc-comb" aria-pressed="true">Combined</button><button type="button" id="sc-triple" aria-pressed="false">Triple</button></div></fieldset><fieldset><legend class="label">Geography or History</legend><div class="seg" role="group" aria-label="Geography or History"><button type="button" id="hu-geo" aria-pressed="true">Geography</button><button type="button" id="hu-his" aria-pressed="false">History</button></div></fieldset><fieldset><legend class="label">Sort by</legend><div class="seg" role="group" aria-label="Sort exams"><button type="button" id="s-date" aria-pressed="true">Date</button><button type="button" id="s-sub" aria-pressed="false">Subject</button></div></fieldset><fieldset><legend class="label">Other subjects</legend><div class="chips" id="chips"></div><div class="tools"><button type="button" class="btn" id="all">Select all</button><button type="button" class="btn" id="none">Clear</button></div></fieldset></aside></div>
<section class="count" aria-label="Countdown"><p id="cdlabel">GCSEs start in</p><dl class="stats"><div class="stat"><dt class="label">Days</dt><dd id="d">0</dd></div><div class="stat"><dt class="label">Hours</dt><dd id="h">0</dd></div><div class="stat"><dt class="label">Minutes</dt><dd id="m">0</dd></div><div class="stat"><dt class="label">Seconds</dt><dd id="s">0</dd></div></dl></section></div>
<script>const BD={"Maths":"Edexcel","Statistics":"Edexcel","English Language":"AQA","English Literature":"AQA","Biology (separate)":"AQA","Chemistry (separate)":"AQA","Physics (separate)":"AQA","Combined Science: Trilogy":"AQA","French":"AQA","Spanish":"AQA","Business":"AQA","Citizenship":"AQA","Geography":"AQA","Computer Science":"OCR","Economics":"OCR","Drama":"Edexcel","History":"WJEC Eduqas","Music":"Edexcel","Art":"AQA","Design & Technology":"AQA","PE":"Edexcel","OCR National Sports Studies":"OCR","OCR National IT":"OCR","BTEC Business":"BTEC"};
const CORE=new Set(["Maths","English Language","English Literature"]);
const TRIPLE=new Set(["Biology (separate)","Chemistry (separate)","Physics (separate)"]);
const COMB="Combined Science: Trilogy";
const OPT=["French","Citizenship","Statistics","Spanish","Business","Computer Science","Drama","Economics","Music","Music Tech","Art","Design & Technology","PE","OCR National Sports Studies","OCR National IT","BTEC Business"];
const ALL=[...CORE,...TRIPLE,COMB,"Geography","History",...OPT];
const HUES=Object.fromEntries(ALL.map((s,i)=>[s,Math.round(i*(360/ALL.length)+10)]));
const D=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],M=["January","February","March","April","May","June","July","August","September","October","November","December"];

const E=[["Biology (separate)","Paper 1","2027-05-11","09:00"],["Biology (separate)","Paper 2","2027-06-10","09:00"],["Chemistry (separate)","Paper 1","2027-05-17","09:00"],["Chemistry (separate)","Paper 2","2027-06-15","09:00"],["Physics (separate)","Paper 1","2027-05-25","09:00"],["Physics (separate)","Paper 2","2027-06-18","09:00"],["English Language","Paper 1","2027-05-24","09:00"],["English Language","Paper 2","2027-06-08","09:00"],["English Literature","Paper 1","2027-05-12","09:00"],["English Literature","Paper 2","2027-05-19","09:00"],["Maths","Paper 1 (non-calculator)","2027-05-14","09:00"],["Maths","Paper 2 (calculator)","2027-05-27","09:00"],["Maths","Paper 3 (calculator)","2027-06-14","09:00"],["Statistics","Paper 1","2027-06-07","13:30"],["Statistics","Paper 2","2027-06-16","09:00"],["French","Listening & Reading","2027-05-26","09:00"],["French","Writing","2027-06-08","13:30"],["Spanish","Listening & Reading","2027-06-09","09:00"],["Spanish","Writing","2027-06-16","13:30"],["Business","Paper 1","2027-05-12","13:30"],["Business","Paper 2","2027-05-21","13:30"],["Citizenship","Paper 1","2027-05-10","13:30"],["Citizenship","Paper 2","2027-05-20","13:30"],[COMB,"Biology Paper 1","2027-05-11","09:00"],[COMB,"Chemistry Paper 1","2027-05-17","09:00"],[COMB,"Physics Paper 1","2027-05-25","09:00"],[COMB,"Biology Paper 2","2027-06-10","09:00"],[COMB,"Chemistry Paper 2","2027-06-15","09:00"],[COMB,"Physics Paper 2","2027-06-18","09:00"],["Computer Science","Paper 1: Computer Systems","2027-05-10","09:00"],["Computer Science","Paper 2: Computational Thinking","2027-05-19","13:30"],["Drama","Component 3: Theatre Makers in Practice","2027-05-14","13:30"],["Economics","Paper 1: Introduction to Economics","2027-05-13","13:30"],["Economics","Paper 2: National & International Economics","2027-05-25","13:30"],["Geography","Paper 1","2027-05-18","09:00"],["Geography","Paper 2","2027-05-26","13:30"],["Geography","Paper 3","2027-06-10","13:30"],["History","Component 1","2027-05-20","09:00"],["History","Component 2","2027-05-28","09:00"],["Music","Component 3: Appraising","2027-05-27","13:30"],["Music Tech","Written exam · PM slot, confirm board and time with your school","2027-06-10","13:30"],["Design & Technology","Written exam","2027-06-15","13:30"],["PE","Component 1: Fitness and Body Systems","2027-05-13","13:30"],["PE","Component 2: Health and Performance","2027-05-20","13:30"],["OCR National Sports Studies","R184: Contemporary Issues in Sport","2027-05-17","13:30"],["OCR National IT","R050: IT in the digital world",null,null],["BTEC Business","Component 3",null,null],["Art","Externally set assignment, dates set by your school",null,null]].map(([sub,name,date,time])=>{
  const d=date?new Date(date+"T12:00:00"):null;
  return {
    sub,name,date,time,
    ts:date?Date.parse(date+"T"+time+":00+01:00"):null,
    dl:d?`${D[d.getDay()]} ${d.getDate()} ${M[d.getMonth()]}`:"Date to be confirmed",
    ds:d?`${D[d.getDay()].slice(0,3)} ${d.getDate()} ${M[d.getMonth()].slice(0,3)}`:""
  };
}).sort((a,b)=>(a.ts||1e15)-(b.ts||1e15));

let sel={},sort="date",sci="comb",hum="geo",cdnNodes=[];
try{const sv=JSON.parse(localStorage.getItem("gcse27c"));if(sv){sel=sv.sel||{};sort=sv.sort||"date";sci=sv.sci||"comb";hum=sv.hum||"geo"}}catch(x){}
function save(){try{localStorage.setItem("gcse27c",JSON.stringify({sel,sort,sci,hum}))}catch(x){}}

const $=id=>document.getElementById(id);
const elList=$("list"),elChips=$("chips"),elSDate=$("s-date"),elSSub=$("s-sub"),elScTrip=$("sc-triple"),elScComb=$("sc-comb"),elHuGeo=$("hu-geo"),elHuHis=$("hu-his"),elCdLab=$("cdlabel"),elD=$("d"),elH=$("h"),elM=$("m"),elS=$("s");

const chipBtns=OPT.map(s=>{
  const b=document.createElement("button");
  b.type="button";b.className="chip";b.textContent=s;
  b.onclick=()=>{sel[s]=!sel[s];b.setAttribute("aria-pressed",!!sel[s]);save();render()};
  elChips.appendChild(b);
  return {s,b};
});
function syncChips(){chipBtns.forEach(({s,b})=>b.setAttribute("aria-pressed",!!sel[s]))}

function shown(s){return CORE.has(s)||(sci==="triple"?TRIPLE.has(s):s===COMB)||(s==="Geography"&&hum==="geo")||(s==="History"&&hum==="his")||!!sel[s]}

function card(e,bySub,now){
  const und=!e.ts,past=!und&&e.ts<now;
  return `<div class="exam${past?" done":""}" style="--h:${HUES[e.sub]}"><div class="when">${und?"TBC":bySub?e.ds:e.time}<small>${und?"":bySub?e.time:""}</small></div><div class="what"><b>${e.sub}</b><span>${e.name}${BD[e.sub]?" · "+BD[e.sub]:""}</span></div><div class="cdn"${und?">TBC":` data-ts="${e.ts}">`}</div></div>`;
}

function render(){
  elSDate.setAttribute("aria-pressed",sort==="date");
  elSSub.setAttribute("aria-pressed",sort==="sub");
  elScTrip.setAttribute("aria-pressed",sci==="triple");
  elScComb.setAttribute("aria-pressed",sci==="comb");
  elHuGeo.setAttribute("aria-pressed",hum==="geo");
  elHuHis.setAttribute("aria-pressed",hum==="his");
  const L=E.filter(e=>shown(e.sub)),now=Date.now();
  let h="";
  if(sort==="date"){
    let last="";
    for(const e of L){
      const key=e.date||"tbc";
      if(key!==last){last=key;h+=`<span class="label group">${e.dl}</span>`}
      h+=card(e,false,now);
    }
  }else{
    const byS=new Map();
    for(const e of L){let g=byS.get(e.sub);if(!g)byS.set(e.sub,g=[]);g.push(e)}
    for(const s of ALL){
      const g=byS.get(s);
      if(g){h+=`<span class="label group">${s}</span>`;for(const e of g)h+=card(e,true,now)}
    }
  }
  elList.innerHTML=h;
  cdnNodes=Array.from(elList.querySelectorAll(".cdn[data-ts]"),n=>({n,ts:+n.getAttribute("data-ts")}));
  rows(now);
}

const pad=x=>(x<10?"0":"")+x;
function rows(now){
  for(const {n,ts} of cdnNodes){
    const t=ts-now;
    if(t<=0){if(n.textContent!=="finished"){n.textContent="finished";n.closest(".exam").classList.add("done")}continue}
    const s=(t/1000)|0;
    n.textContent=`${(s/86400)|0}d ${pad(((s%86400)/3600)|0)}h ${pad(((s%3600)/60)|0)}m ${pad(s%60)}s`;
  }
}

elSDate.onclick=()=>{sort="date";save();render()};
elSSub.onclick=()=>{sort="sub";save();render()};
elScTrip.onclick=()=>{sci="triple";save();render()};
elScComb.onclick=()=>{sci="comb";save();render()};
elHuGeo.onclick=()=>{hum="geo";save();render()};
elHuHis.onclick=()=>{hum="his";save();render()};
$("all").onclick=()=>{OPT.forEach(s=>sel[s]=true);save();syncChips();render()};
$("none").onclick=()=>{sel={};save();syncChips();render()};

const START=E[0].ts;
let lastLab="";
function tick(){
  const now=Date.now();
  let t=START-now;
  const txt=t<=0?"GCSEs have started":"GCSEs start Monday 10 May 2027, 9:00 AM";
  if(txt!==lastLab){elCdLab.textContent=lastLab=txt}
  if(t<0)t=0;
  const s=(t/1000)|0;
  elD.textContent=(s/86400)|0;
  elH.textContent=((s%86400)/3600)|0;
  elM.textContent=((s%3600)/60)|0;
  elS.textContent=s%60;
  rows(now);
}
syncChips();render();tick();setInterval(tick,1000);</script></body></html>
