<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0f172a;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: #fff;
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    #list {
      width: min(20rem, calc(100vw - 2.5rem));
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin: 0;
      padding: 0;
      position: relative;
    }

    .btn {
      position: relative;
      display: block;
      width: 100%;
      padding: 1rem 1.25rem;
      border: 1px solid rgba(15, 23, 42, .08);
      border-radius: .8rem;
      background: var(--ink);
      box-shadow: 0 5px 0 rgba(15, 23, 42, .08);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      text-decoration: none;
      overflow-wrap: anywhere;
      user-select: none;
      transition:
        background-color .16s ease,
        transform .45s cubic-bezier(.2, .85, .2, 1),
        box-shadow .35s ease;
    }
    .btn:hover {
      background: #263650;
      box-shadow: 0 7px 0 rgba(15, 23, 42, .08);
      transform: translateY(-2px);
    }
    .btn:active {
      background: #020617;
      box-shadow: 0 1px 0 rgba(15, 23, 42, .08);
      transform: translateY(3px);
    }
    .btn:focus-visible {
      outline: 3px solid #fb7185;
      outline-offset: 4px;
    }

    /* Maths Tri-Weekly 2 fade-in states */
    #btn-maths2.dimmed {
      opacity: .06;
      transition: none;
    }
    #btn-maths2.fading {
      transition: opacity 2.4s ease;
    }

    #replay-btn {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 35;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .45rem .75rem;
      border: 1px solid rgba(15, 23, 42, .12);
      border-radius: 999px;
      background: rgba(255, 255, 255, .9);
      color: #64748b;
      font-family: inherit;
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .35s ease, transform .35s ease, color .16s ease, border-color .16s ease;
      pointer-events: none;
    }
    body.settled #replay-btn {
      opacity: .75;
      transform: translateY(0);
      pointer-events: auto;
    }
    #replay-btn:hover {
      opacity: 1 !important;
      color: var(--ink);
      border-color: rgba(15, 23, 42, .3);
    }
  </style>
</head>
<body>

  <main id="stage">
    <nav id="list" aria-label="Links">
      <a class="btn" href="https://joelmensah.github.io/triweekly/english1">English Tri-Weekly 1</a>
      <a class="btn" id="btn-maths2" href="http://joelmensah.github.io/maths/maths2">Maths Tri-Weekly 2</a>
      <a class="btn" href="https://joelmensah.github.io/gcse/timetable">GCSE Timetable</a>
      <a class="btn" href="https://joelmensah.github.io/hannah/kettle.html">Hannah Kettle</a>
    </nav>
  </main>

  <button id="replay-btn" type="button" title="Type 'replay' or click to watch again">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
    </svg>
    Replay Animation
  </button>

  <script>
    (() => {
      const KEY = 'links_seen_maths2_v2';
      const btn = document.getElementById('btn-maths2');
      const replayBtn = document.getElementById('replay-btn');
      const body = document.body;

      let replayBuffer = '';
      let replayBufferTimer = null;

      function playFade(token) {
        body.classList.remove('settled');
        btn.classList.remove('fading');
        btn.classList.add('dimmed');

        // Let the browser paint the faint state first
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            btn.classList.add('fading');
            requestAnimationFrame(() => {
              btn.classList.remove('dimmed');
            });
          });
        });

        setTimeout(() => {
          body.classList.add('settled');
          if (token === 0) {
            try { localStorage.setItem(KEY, '1'); } catch (e) {}
          }
        }, 2500);
      }

      let seen = null;
      try { seen = localStorage.getItem(KEY); } catch (e) {}

      if (seen) {
        body.classList.add('settled');
      } else {
        playFade(0);
      }

      replayBtn.addEventListener('click', () => {
        playFade(1);
      });

      window.addEventListener('keydown', event => {
        if (event.ctrlKey || event.altKey || event.metaKey || event.key.length !== 1) return;
        replayBuffer = (replayBuffer + event.key.toLowerCase()).slice(-6);
        if (replayBuffer.endsWith('replay')) {
          replayBuffer = '';
          if (replayBufferTimer !== null) clearTimeout(replayBufferTimer);
          replayBufferTimer = null;
          playFade(1);
          return;
        }
        if (replayBufferTimer !== null) clearTimeout(replayBufferTimer);
        replayBufferTimer = setTimeout(() => {
          replayBuffer = '';
          replayBufferTimer = null;
        }, 2500);
      });
    })();
  </script>
</body>
</html>
