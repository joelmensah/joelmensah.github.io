<!DOCTYPE html>
<html lang=en>
<head>
<meta charset=UTF-8>
<meta name=viewport content=width=device-width,initial-scale=1.0>
<title>Links</title>
<script src=https://cdn.tailwindcss.com></script>
<link href=https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap rel=stylesheet>
<style>
body {
    font-family: Inter, sans-serif;
    background-color: #ffffff;
}
#list {
    width: 100%;
    max-width: 20rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}
.btn {
    width: 100%;
    padding: 1rem 1.5rem;
    background-color: #0f172a;
    color: #ffffff;
    font-weight: 500;
    text-align: center;
    border-radius: 0.75rem;
    transition: background-color 0.15s;
    display: block;
    text-decoration: none;
}
.btn:hover {
    background-color: #1e293b;
}
.btn:active {
    background-color: #020617;
}
</style>
</head>
<body class=min-h-screen style=display:flex;align-items:center;justify-content:center;padding:1.5rem;margin:0>

<div id=list></div>

<script>
const raw = document.getElementById(`links`).textContent;
const box = document.getElementById(`list`);

raw.split(/\n/).forEach(line => {
    const trimmed = line.trim();
    if (!trimmed) return;

    const match = trimmed.match(/^(.*?)\s+(https?:\/\/\S+)$/i);
    if (match) {
        const a = document.createElement(`a`);
        a.href = match[2].trim();
        a.className = `btn`;
        a.textContent = match[1].trim();
        box.appendChild(a);
    }
});
</script>
</body>
</html>
