<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root { --ink: #0f172a; }
* { box-sizing: border-box; }
html, body { width: 100%; min-height: 100%; margin: 0; }
body {
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  background: #fff;
  color: var(--ink);
  font-family: Inter, Arial, sans-serif;
}

/* Old-style website that the meteor hits. */
#legacy {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  background: #fff;
  opacity: 0;
  visibility: hidden;
  transition: opacity .4s ease, visibility 0s linear .4s;
}
body.legacy-view #legacy { opacity: 1; visibility: visible; transition-delay: 0s; }
body.final-start #legacy { opacity: 0; visibility: hidden; }
.legacy-list {
  width: min(20rem, calc(100vw - 3rem));
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.btn {
  display: block;
  width: 100%;
  padding: 1rem 1.25rem;
  border: 1px solid rgba(15, 23, 42, .08);
  border-radius: .8rem;
  background: var(--ink);
  box-shadow: 0 5px 0 rgba(15, 23, 42, .08);
  color: #fff;
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.35;
  text-align: center;
  text-decoration: none;
  overflow-wrap: anywhere;
  transition: background-color .16s ease, transform .16s ease, box-shadow .16s ease;
}
.btn:hover { background: #263650; box-shadow: 0 7px 0 rgba(15, 23, 42, .08); transform: translateY(-2px); }
.btn:active { background: #020617; box-shadow: 0 1px 0 rgba(15, 23, 42, .08); transform: translateY(3px); }
.btn:focus-visible { outline: 3px solid #fb7185; outline-offset: 4px; }

/* New website: goes black after the strike, unlocks the new button, then settles to white. */
#stage {
  position: fixed;
  inset: 0;
  z-index: 15;
  overflow-x: hidden;
  overflow-y: auto;
  background: #000;
  opacity: 0;
  visibility: hidden;
  transition: background-color 1s ease, opacity .5s ease, visibility 0s linear .5s;
}
body.final-start #stage { opacity: 1; visibility: visible; transition-delay: 0s; }
body.settled #stage { background: #fff; }

#list {
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(20rem, calc(100vw - 2.5rem));
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin: 0;
  padding: 0;
  transform: translate(-50%, -50%);
}
/* Hidden until the settle phase; the new button is held at screen centre via --dy. */
#list .btn {
  opacity: 0;
  transition: opacity .9s ease, translate 1.3s cubic-bezier(.2,.85,.2,1), scale 1.3s cubic-bezier(.2,.85,.2,1),
              background-color .16s ease, box-shadow .5s ease, transform .16s ease;
}
#list .new-btn {
  position: relative;
  overflow: hidden;
  translate: 0 var(--dy, 0px);
  scale: 1.12;
}
body.unlock #list .new-btn {
  opacity: 1;
  border-color: #fde68a;
  box-shadow: 0 0 0 2px #fde68a, 0 0 28px 6px rgba(253,224,71,.65), 0 0 90px 22px rgba(251,191,36,.35);
}
#list .new-btn::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: -60%;
  width: 40%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent);
  transform: skewX(-20deg);
  opacity: 0;
}
body.unlock #list .new-btn::after { opacity: 1; animation: sheen 1.5s ease-in-out infinite; }
@keyframes sheen { from { left: -60%; } to { left: 130%; } }

body.settled #list .btn { opacity: 1; }
body.settled #list .new-btn { translate: 0 0; scale: 1; }

/* "New Button Unlocked!" message */
#unlock-msg {
  position: absolute;
  top: calc(50% - 4.6rem);
  left: 50%;
  margin: 0;
  font-family: "Lilita One", Impact, sans-serif;
  font-size: clamp(1.7rem, 6vw, 2.8rem);
  font-weight: 400;
  white-space: nowrap;
  letter-spacing: .02em;
  background: linear-gradient(100deg, #fbbf24 0%, #fff7c2 25%, #fbbf24 50%, #fff7c2 75%, #fbbf24 100%);
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 14px rgba(251,191,36,.8));
  opacity: 0;
  transform: translate(-50%, -50%) scale(.55);
  transition: opacity .6s ease, transform .7s cubic-bezier(.2,1.4,.3,1);
  pointer-events: none;
}
body.unlock #unlock-msg {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  animation: glint 2s linear infinite;
}
@keyframes glint { to { background-position: -250% 0; } }

#sparkles { position: absolute; inset: 0; pointer-events: none; transition: opacity .8s ease; }
#sparkles.fade { opacity: 0; }
.star {
  position: absolute;
  color: #fde68a;
  text-shadow: 0 0 8px #fbbf24, 0 0 18px #f59e0b;
  line-height: 1;
  opacity: 0;
  animation: twinkle var(--d, 1.6s) ease-in-out var(--delay, 0s) infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); }
  50% { opacity: 1; transform: scale(1) rotate(90deg); }
}

body.resetting #legacy, body.resetting #stage, body.resetting #list .btn, body.resetting #unlock-msg {
  transition: none !important;
}

/* Warning overlay */
#warn { position: fixed; inset: 0; z-index: 50; display: none; pointer-events: none; }
#vig { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 23%, rgba(255, 0, 0, .62) 100%); }
#warnText {
  position: absolute; top: 50%; left: 50%;
  color: #ff2020; white-space: nowrap;
  font: 800 clamp(22px, 5.5vw, 56px)/1 Inter, sans-serif;
  letter-spacing: .06em; opacity: .1;
  transform: translate(-50%, -50%) scale(.35);
}

/* Meteor */
#fx { position: fixed; inset: 0; z-index: 60; overflow: hidden; pointer-events: none; }
.met { position: absolute; top: 0; left: 0; width: 0; height: 0; }
.met-in { position: absolute; top: 0; left: 0; transform: rotate(var(--a)); }
.tail {
  position: absolute; top: -78px; left: -1420px; width: 1420px; height: 156px;
  clip-path: polygon(0 50%, 100% 0, 100% 100%);
  background: linear-gradient(90deg, transparent 0%, rgba(255,45,0,.04) 26%, rgba(255,76,0,.2) 53%, rgba(255,142,23,.72) 78%, rgba(255,221,147,.98) 100%);
  filter: blur(2px);
}
.tail::before {
  content: ""; position: absolute; top: 39%; right: 0; width: 100%; height: 22%;
  background: linear-gradient(90deg, transparent, rgba(255,96,0,.22), rgba(255,243,190,.95));
  filter: blur(6px);
}
.tail::after {
  content: ""; position: absolute; top: 17%; right: 0; width: 74%; height: 8%;
  background: linear-gradient(90deg, transparent, rgba(255,178,54,.65), rgba(255,255,229,.9));
  filter: blur(4px);
}
.rock {
  position: absolute; top: -115px; left: -115px; width: 230px; height: 230px; overflow: hidden;
  clip-path: polygon(50% 0%,64% 5%,75% 13%,90% 18%,98% 34%,92% 48%,100% 61%,87% 75%,77% 88%,61% 91%,52% 100%,37% 92%,23% 89%,13% 75%,3% 63%,9% 47%,2% 34%,13% 23%,18% 12%,35% 8%);
  background:
    radial-gradient(ellipse at 32% 26%, rgba(255,255,220,.98) 0 3%, rgba(255,213,108,.96) 7%, rgba(255,129,22,.85) 17%, transparent 31%),
    radial-gradient(ellipse at 66% 62%, #601907 0 7%, #a92c08 15%, transparent 29%),
    radial-gradient(ellipse at 38% 63%, #ffb23f 0 7%, #e64c0a 27%, transparent 43%),
    radial-gradient(ellipse at 54% 43%, #ff8c19 0, #d84108 34%, #64200a 69%, #1f0a05 100%);
  box-shadow: 0 0 34px 20px rgba(255,107,11,.98), 0 0 100px 52px rgba(255,61,0,.75), 0 0 180px 88px rgba(255,25,0,.36);
}
.rock::before {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 30% 38%, rgba(255,246,186,.7) 0 2%, transparent 14%),
    radial-gradient(ellipse at 70% 29%, rgba(255,194,75,.55) 0 3%, transparent 15%),
    radial-gradient(ellipse at 62% 71%, rgba(26,7,3,.78) 0 7%, transparent 14%),
    radial-gradient(ellipse at 31% 70%, rgba(45,8,2,.7) 0 6%, transparent 13%);
  mix-blend-mode: screen;
}
.rock::after {
  content: ""; position: absolute; inset: 9%;
  border: 5px solid rgba(255,177,58,.62);
  border-left-color: rgba(255,245,190,.95);
  border-bottom-color: rgba(255,60,0,.14);
  border-radius: 42% 58% 47% 53%;
  transform: rotate(-28deg) scale(1.03);
  filter: blur(4px);
}
.fb, .ring, .scorch, .puff, .spark { position: absolute; border-radius: 50%; }
.fb { width: 230px; height: 230px; margin: -115px 0 0 -115px; background: radial-gradient(circle, #fff 0, #fff4bd 12%, #ffc64b 25%, #ff7119 42%, #dd2424 61%, transparent 73%); }
.ring { width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 9px solid #24201c; box-shadow: 0 0 25px rgba(255,140,35,.8), inset 0 0 18px rgba(255,180,45,.35); }
.scorch { width: 500px; height: 500px; margin: -250px 0 0 -250px; background: radial-gradient(ellipse, rgba(15,8,6,.74) 0, rgba(55,20,8,.42) 34%, transparent 71%); }
.puff { width: 180px; height: 180px; margin: -90px 0 0 -90px; background: radial-gradient(circle, rgba(42,37,34,.7), rgba(74,45,29,.32) 42%, transparent 73%); }
.spark { width: 9px; height: 18px; border-radius: 2px; }
.flash { position: absolute; inset: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
  #legacy, #stage, #list .btn, #unlock-msg { transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<!-- Temporary old website shown only for the meteor impact. -->
<div id="legacy" aria-hidden="true">
  <div class="legacy-list" id="legacy-list">
    <a class="btn" href="https://joelmensah.github.io/triweekly/english1">English Tri-Weekly 1</a>
    <a class="btn" href="https://joelmensah.github.io/gcse/timetable">GCSE Timetable</a>
    <a class="btn" href="https://joelmensah.github.io/hannah/kettle.html">Hannah Kettle</a>
  </div>
</div>

<!-- Final website. -->
<main id="stage">
  <nav id="list" aria-label="Links"></nav>
  <div id="sparkles"></div>
  <p id="unlock-msg" aria-hidden="true">New Button Unlocked!</p>
</main>

<div id="warn" aria-hidden="true"><div id="vig"></div><div id="warnText">! WARNING !</div></div>
<div id="fx" aria-hidden="true"></div>

<script id="links" type="text/plain">
English Tri-Weekly 1 https://joelmensah.github.io/triweekly/english1
GCSE Timetable https://joelmensah.github.io/gcse/timetable
Hannah Kettle https://joelmensah.github.io/hannah/kettle.html
Maths: Ranked https://joelmensah.github.io/maths/ranked
</script>

<script>
(() => {
  const KEY = 'links_intro_v6';
  const $ = id => document.getElementById(id);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const body = document.body;
  const legacyList = $('legacy-list');
  const list = $('list');
  const fx = $('fx');
  const sparkles = $('sparkles');
  let runId = 0;
  const sequenceTimers = new Set();
  let replayBuffer = '';
  let replayBufferTimer = null;

  function later(callback, delay, token = runId) {
    const id = setTimeout(() => {
      sequenceTimers.delete(id);
      if (token === runId) callback();
    }, delay);
    sequenceTimers.add(id);
    return id;
  }
  function clearSequenceTimers() {
    for (const id of sequenceTimers) clearTimeout(id);
    sequenceTimers.clear();
  }

  /* Build the final links; the last one is the newly unlocked button. */
  list.replaceChildren();
  $('links').textContent.split('\n').forEach(line => {
    const match = line.trim().match(/^(.*?)\s+(https?:\/\/\S+)$/i);
    if (!match) return;
    const a = document.createElement('a');
    a.href = match[2];
    a.className = 'btn';
    a.textContent = match[1].trim();
    list.appendChild(a);
  });
  const newBtn = list.lastElementChild;
  newBtn.classList.add('new-btn');

  function mk(cls, css) {
    const el = document.createElement('div');
    el.className = cls;
    if (css) el.style.cssText = css;
    fx.appendChild(el);
    return el;
  }

  function shake(el, amount, duration) {
    const frames = [{ transform: 'none' }];
    for (let i = 0; i < 12; i++) {
      frames.push({ transform: `translate(${rnd(-amount, amount)}px, ${rnd(-amount, amount)}px) rotate(${rnd(-amount / 6, amount / 6)}deg)` });
    }
    frames.push({ transform: 'none' });
    el.animate(frames, { duration, easing: 'linear' });
  }

  function warning(done, token) {
    const w = $('warn'), t = $('warnText'), v = $('vig');
    w.style.display = 'block';
    const duration = 2400;
    const start = performance.now();
    (function frame(now) {
      if (token !== runId) return;
      const progress = Math.min(1, (now - start) / duration);
      const eased = Math.pow(progress, 1.55);
      const pulse = 1 + .06 * Math.sin((now - start) / 1000 * (5 + 12 * progress)) * (.4 + progress);
      t.style.opacity = .12 + .88 * eased;
      t.style.transform = `translate(-50%, -50%) scale(${(.35 + 2.1 * eased) * pulse})`;
      t.style.textShadow = `0 0 ${8 + 50 * eased}px #ff1a1a, 0 0 ${20 + 130 * eased}px #ff1a1a, 0 0 ${40 + 220 * eased}px rgba(255,0,0,.8)`;
      v.style.opacity = Math.min(1, .1 + .9 * eased * pulse);
      w.style.background = `rgba(40,0,0,${.32 * eased})`;
      if (progress < 1) requestAnimationFrame(frame);
      else { w.style.display = 'none'; done(); }
    })(start);
  }

  function meteor(cx, cy, done, token) {
    const x0 = cx - innerWidth * .88;
    const y0 = cy - innerHeight * .94;
    const angle = Math.atan2(cy - y0, cx - x0) * 180 / Math.PI;
    const m = mk('met');
    m.innerHTML = '<div class="met-in" style="--a:' + angle + 'deg"><div class="tail"></div><div class="rock"></div></div>';
    const animation = m.animate([
      { transform: `translate(${x0}px, ${y0}px) scale(.3)` },
      { transform: `translate(${cx}px, ${cy}px) scale(2.35)` }
    ], { duration: 1500, easing: 'cubic-bezier(.48, 0, .86, .46)', fill: 'forwards' });
    animation.onfinish = () => { m.remove(); if (token === runId) done(); };
  }

  function explode(cx, cy) {
    const at = `left:${cx}px;top:${cy}px;`;
    mk('scorch', at).animate([{ transform: 'scale(.3)', opacity: .9 }, { transform: 'scale(1.8)', opacity: 0 }], { duration: 3000, easing: 'ease-out', fill: 'forwards' });
    mk('fb', at).animate([{ transform: 'scale(.12)', opacity: 1 }, { transform: 'scale(6.2)', opacity: 0 }], { duration: 1050, easing: 'ease-out', fill: 'forwards' });
    mk('ring', at).animate([{ transform: 'scale(.7)', opacity: .95 }, { transform: 'scale(32)', opacity: 0 }], { duration: 1050, easing: 'ease-out', fill: 'forwards' });
    mk('flash', `background:radial-gradient(circle at ${cx}px ${cy}px, #fff 0, rgba(255,205,100,.9) 14%, rgba(255,90,15,.65) 37%, transparent 73%)`)
      .animate([{ opacity: .98 }, { opacity: 0 }], { duration: 850, fill: 'forwards' });

    const colours = ['#ff3b30', '#ff9500', '#ffcc00', '#25201d', '#fff0bd'];
    for (let i = 0; i < 100; i++) {
      const angle = rnd(0, Math.PI * 2);
      const distance = rnd(150, Math.max(innerWidth, innerHeight) * .82);
      mk('spark', at + 'background:' + colours[i % colours.length]).animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance + 100}px) rotate(${rnd(-760, 760)}deg)`, opacity: 0 }
      ], { duration: rnd(1000, 1750), easing: 'cubic-bezier(.1,.8,.3,1)', fill: 'forwards' });
    }
    for (let i = 0; i < 9; i++) {
      mk('puff', at).animate([
        { transform: 'translate(0,0) scale(.35)', opacity: .85 },
        { transform: `translate(${rnd(-220, 220)}px, ${rnd(-260, -70)}px) scale(${rnd(2.5, 3.7)})`, opacity: 0 }
      ], { duration: 1900, delay: rnd(50, 370), easing: 'ease-out', fill: 'forwards' });
    }
    shake(legacyList, 22, 780);
    [...legacyList.children].forEach(child => child.animate([
      { transform: 'none' },
      { transform: `translate(${rnd(-24, 24)}px, ${rnd(-18, 18)}px) rotate(${rnd(-7, 7)}deg)` },
      { transform: 'none' }
    ], { duration: 720, easing: 'ease-out' }));
  }

  /* Sparkles around the message and the glowing button. */
  function makeSparkles() {
    sparkles.classList.remove('fade');
    sparkles.replaceChildren();
    const spreadX = Math.min(innerWidth * .42, 230);
    for (let i = 0; i < 34; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.textContent = i % 3 ? '✦' : '✧';
      s.style.left = `calc(50% + ${rnd(-spreadX, spreadX)}px)`;
      s.style.top = `calc(50% + ${rnd(-130, 50)}px)`;
      s.style.fontSize = rnd(10, 26) + 'px';
      s.style.setProperty('--d', rnd(1.1, 2.2) + 's');
      s.style.setProperty('--delay', rnd(0, 2) + 's');
      sparkles.appendChild(s);
    }
  }

  /* Black screen -> new button shines in the centre -> it travels to its place. */
  function revealFinalSite(token) {
    body.classList.add('final-start');                // page goes black
    later(() => {
      makeSparkles();
      body.classList.add('unlock');                   // message + glowing button
    }, 1000, token);
    later(() => {
      body.classList.remove('unlock');
      body.classList.add('settled');                  // button glides into position
      sparkles.classList.add('fade');
    }, 4800, token);
    later(() => { sparkles.replaceChildren(); fx.replaceChildren(); }, 6200, token);
  }

  function playFullSequence() {
    runId++;
    const token = runId;
    clearSequenceTimers();
    if (replayBufferTimer !== null) { clearTimeout(replayBufferTimer); replayBufferTimer = null; }
    replayBuffer = '';

    document.getAnimations().forEach(a => { try { a.cancel(); } catch (e) {} });
    body.classList.add('resetting');
    void body.offsetWidth;
    body.classList.remove('legacy-view', 'final-start', 'unlock', 'settled');
    fx.replaceChildren();
    sparkles.replaceChildren();

    /* Measure how far the new button must sit from screen centre while it is held there. */
    newBtn.style.setProperty('--dy', '0px');
    const r = newBtn.getBoundingClientRect();
    newBtn.style.setProperty('--dy', (innerHeight / 2 - (r.top + r.height / 2)) + 'px');

    const wo = $('warn'), wt = $('warnText'), vg = $('vig');
    wo.style.display = 'none';
    wo.style.background = '';
    wt.style.opacity = '.1';
    wt.style.transform = 'translate(-50%, -50%) scale(.35)';
    wt.style.textShadow = '';
    vg.style.opacity = '0';

    void body.offsetWidth;
    body.classList.remove('resetting');
    void body.offsetWidth;

    body.classList.add('legacy-view');
    later(() => {
      warning(() => {
        if (token !== runId) return;
        const rect = legacyList.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        meteor(cx, cy, () => {
          if (token !== runId) return;
          explode(cx, cy);
          later(() => {
            revealFinalSite(token);
            try { localStorage.setItem(KEY, '1'); } catch (e) {}
          }, 260, token);
        }, token);
      }, token);
    }, 650, token);
  }

  let storageOK = true;
  let seen = null;
  try { seen = localStorage.getItem(KEY); } catch (e) { storageOK = false; }
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const forceIntro = /[?&]intro\b/.test(location.search);
  const playIntro = forceIntro || (storageOK && !seen && !reduceMotion);

  /* Typing "replay" anywhere restarts the whole sequence. */
  window.addEventListener('keydown', event => {
    if (event.ctrlKey || event.altKey || event.metaKey || event.key.length !== 1) return;
    replayBuffer = (replayBuffer + event.key.toLowerCase()).slice(-6);
    if (replayBuffer.endsWith('replay')) {
      replayBuffer = '';
      if (replayBufferTimer !== null) clearTimeout(replayBufferTimer);
      replayBufferTimer = null;
      playFullSequence();
      return;
    }
    if (replayBufferTimer !== null) clearTimeout(replayBufferTimer);
    replayBufferTimer = setTimeout(() => { replayBuffer = ''; replayBufferTimer = null; }, 2500);
  });

  if (!playIntro) body.classList.add('final-start', 'settled');
  else playFullSequence();
})();
</script>
</body>
</html>
