<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0f172a;
}
* { box-sizing: border-box; }
html, body { width: 100%; min-height: 100%; margin: 0; }
body {
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  background: #fff;
  color: var(--ink);
  font-family: Inter, Arial, sans-serif;
  transition: background-color .5s ease;
}

/* Temporary old website shown only for the meteor impact */
#legacy {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  background: #fff;
  opacity: 0;
  visibility: hidden;
  transition: opacity .35s ease, visibility 0s linear .35s;
}
body.legacy-view #legacy {
  opacity: 1;
  visibility: visible;
  transition-delay: 0s;
}
body.blackout #legacy,
body.rising #legacy {
  opacity: 0;
  visibility: hidden;
  transition-delay: 0s;
}

.legacy-list {
  width: min(20rem, calc(100vw - 3rem));
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.btn {
  position: relative;
  display: block;
  width: 100%;
  padding: 1rem 1.25rem;
  border: 1px solid rgba(15, 23, 42, .08);
  border-radius: .8rem;
  background: var(--ink);
  box-shadow: 0 5px 0 rgba(15, 23, 42, .08);
  color: #fff;
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.35;
  text-align: center;
  text-decoration: none;
  overflow-wrap: anywhere;
  transition:
    background-color .16s ease,
    transform .95s cubic-bezier(.2, .85, .2, 1),
    box-shadow .6s ease,
    opacity .6s ease,
    border-color .6s ease;
}
.btn:hover {
  background: #263650;
  box-shadow: 0 7px 0 rgba(15, 23, 42, .08);
  transform: translateY(-2px);
}
.btn:active {
  background: #020617;
  box-shadow: 0 1px 0 rgba(15, 23, 42, .08);
  transform: translateY(3px);
}
.btn:focus-visible { outline: 3px solid #fb7185; outline-offset: 4px; }

/* Final stage container */
#stage {
  position: fixed;
  inset: 0;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  background: #fff;
  opacity: 0;
  visibility: hidden;
  transition: background-color .85s ease, opacity .35s ease, visibility 0s linear .35s;
}

/* Blackout phase right after meteor strike */
body.blackout {
  background: #000;
}
body.blackout #stage {
  opacity: 1;
  visibility: visible;
  background: #000;
  transition-delay: 0s;
}

/* Final phase when button moves to its slot and page returns to white */
body.rising #stage {
  opacity: 1;
  visibility: visible;
  background: #fff;
  transition-delay: 0s;
}

#list {
  position: relative;
  width: min(20rem, calc(100vw - 3rem));
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin: 0;
  padding: 0;
}

/* Regular buttons stay hidden during the blackout unlock showcase */
body.blackout #list .btn:not(.unlocked-btn) {
  opacity: 0;
  pointer-events: none;
  transform: translateY(10px) scale(.96);
}
body.rising #list .btn:not(.unlocked-btn) {
  opacity: 1;
  pointer-events: auto;
  transform: none;
  transition-delay: .2s;
}

/* The newly unlocked button (Maths Ranked) starts centered and glowing */
body.blackout #list .btn.unlocked-btn {
  z-index: 30;
  transform: translateY(var(--center-offset, 0px)) scale(1.08);
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #1e293b 100%);
  border-color: #fde047;
  box-shadow:
    0 0 25px rgba(250, 204, 21, .9),
    0 0 60px rgba(250, 204, 21, .55),
    0 0 110px rgba(251, 146, 60, .35),
    inset 0 0 15px rgba(254, 240, 138, .4);
  animation: shinePulse 1.3s ease-in-out infinite alternate;
  pointer-events: none;
}

/* Shimmer sweep across the unlocked button */
body.blackout #list .btn.unlocked-btn::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    110deg,
    transparent 20%,
    rgba(255, 255, 255, .5) 48%,
    rgba(255, 255, 255, .75) 50%,
    rgba(255, 255, 255, .5) 52%,
    transparent 80%
  );
  background-size: 220% 100%;
  animation: shimmerSweep 1.6s linear infinite;
  pointer-events: none;
}

@keyframes shinePulse {
  0% {
    box-shadow:
      0 0 22px rgba(250, 204, 21, .8),
      0 0 50px rgba(250, 204, 21, .45),
      0 0 90px rgba(251, 146, 60, .3),
      inset 0 0 12px rgba(254, 240, 138, .35);
  }
  100% {
    box-shadow:
      0 0 36px rgba(254, 240, 138, 1),
      0 0 80px rgba(250, 204, 21, .8),
      0 0 140px rgba(251, 146, 60, .55),
      inset 0 0 22px rgba(255, 255, 255, .65);
  }
}

@keyframes shimmerSweep {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* Moves to its real position in the list */
body.rising #list .btn.unlocked-btn {
  z-index: 1;
  transform: translateY(0) scale(1);
  border-color: rgba(15, 23, 42, .08);
  box-shadow: 0 5px 0 rgba(15, 23, 42, .08);
  animation: none;
  pointer-events: auto;
}
body.rising #list .btn.unlocked-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 0 rgba(15, 23, 42, .08);
}
body.rising #list .btn.unlocked-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 rgba(15, 23, 42, .08);
}

/* "New Button Unlocked!" banner + sparkles */
#unlock-banner {
  position: fixed;
  top: calc(50% - 5.2rem);
  left: 50%;
  z-index: 40;
  transform: translate(-50%, -50%) scale(.7);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  text-align: center;
  white-space: nowrap;
  transition: opacity .45s ease, transform .5s cubic-bezier(.18, 1.25, .4, 1), visibility 0s linear .45s;
}
body.blackout #unlock-banner {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, -50%) scale(1);
  transition-delay: .12s, .12s, 0s;
}
body.rising #unlock-banner {
  opacity: 0;
  visibility: hidden;
  transform: translate(-50%, -85%) scale(.85);
  transition-delay: 0s;
}

.unlock-title {
  display: inline-block;
  font-family: "Lilita One", Impact, sans-serif;
  font-size: clamp(1.55rem, 5.5vw, 2.5rem);
  letter-spacing: .04em;
  background: linear-gradient(90deg, #fde047, #ffffff, #facc15, #fff7ed, #fde047);
  background-size: 200% auto;
  color: #fde047;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 12px rgba(250, 204, 21, .85)) drop-shadow(0 0 28px rgba(234, 179, 8, .55));
  animation: textShine 2s linear infinite;
}

@keyframes textShine {
  to { background-position: 200% center; }
}

/* Floating star sparkles around the banner & button */
.sparkle-star {
  position: fixed;
  z-index: 38;
  width: 14px;
  height: 14px;
  pointer-events: none;
  background: #fef08a;
  clip-path: polygon(50% 0%, 63% 37%, 100% 50%, 63% 63%, 50% 100%, 37% 63%, 0% 50%, 37% 37%);
  box-shadow: 0 0 12px #fde047, 0 0 20px #facc15;
  animation: twinkle 1s ease-in-out infinite alternate;
}

@keyframes twinkle {
  0% { transform: scale(.3) rotate(0deg); opacity: .25; }
  100% { transform: scale(1.25) rotate(45deg); opacity: 1; }
}

/* Used only while resetting a replay */
body.resetting,
body.resetting #legacy,
body.resetting #stage,
body.resetting .btn,
body.resetting #unlock-banner {
  transition: none !important;
}

/* Warning overlay */
#warn { position: fixed; inset: 0; z-index: 50; display: none; pointer-events: none; }
#vig {
  position: absolute;
  inset: 0;
  opacity: 0;
  background: radial-gradient(ellipse at center, transparent 23%, rgba(255, 0, 0, .62) 100%);
}
#warnText {
  position: absolute;
  top: 50%;
  left: 50%;
  color: #ff2020;
  white-space: nowrap;
  font: 800 clamp(22px, 5.5vw, 56px)/1 Inter, sans-serif;
  letter-spacing: .06em;
  opacity: .1;
  transform: translate(-50%, -50%) scale(.35);
}

/* Huge, jagged meteor with a very long fiery tail */
#fx { position: fixed; inset: 0; z-index: 60; overflow: hidden; pointer-events: none; }
.met { position: absolute; top: 0; left: 0; width: 0; height: 0; }
.met-in { position: absolute; top: 0; left: 0; transform: rotate(var(--a)); }
.tail {
  position: absolute;
  top: -78px;
  left: -1420px;
  width: 1420px;
  height: 156px;
  clip-path: polygon(0 50%, 100% 0, 100% 100%);
  background: linear-gradient(90deg, transparent 0%, rgba(255,45,0,.04) 26%, rgba(255,76,0,.2) 53%, rgba(255,142,23,.72) 78%, rgba(255,221,147,.98) 100%);
  filter: blur(2px);
}
.tail::before {
  content: "";
  position: absolute;
  top: 39%;
  right: 0;
  width: 100%;
  height: 22%;
  background: linear-gradient(90deg, transparent, rgba(255,96,0,.22), rgba(255,243,190,.95));
  filter: blur(6px);
}
.tail::after {
  content: "";
  position: absolute;
  top: 17%;
  right: 0;
  width: 74%;
  height: 8%;
  background: linear-gradient(90deg, transparent, rgba(255,178,54,.65), rgba(255,255,229,.9));
  filter: blur(4px);
}
.rock {
  position: absolute;
  top: -115px;
  left: -115px;
  width: 230px;
  height: 230px;
  overflow: hidden;
  clip-path: polygon(50% 0%,64% 5%,75% 13%,90% 18%,98% 34%,92% 48%,100% 61%,87% 75%,77% 88%,61% 91%,52% 100%,37% 92%,23% 89%,13% 75%,3% 63%,9% 47%,2% 34%,13% 23%,18% 12%,35% 8%);
  background:
    radial-gradient(ellipse at 32% 26%, rgba(255,255,220,.98) 0 3%, rgba(255,213,108,.96) 7%, rgba(255,129,22,.85) 17%, transparent 31%),
    radial-gradient(ellipse at 66% 62%, #601907 0 7%, #a92c08 15%, transparent 29%),
    radial-gradient(ellipse at 38% 63%, #ffb23f 0 7%, #e64c0a 27%, transparent 43%),
    radial-gradient(ellipse at 54% 43%, #ff8c19 0, #d84108 34%, #64200a 69%, #1f0a05 100%);
  box-shadow: 0 0 34px 20px rgba(255,107,11,.98), 0 0 100px 52px rgba(255,61,0,.75), 0 0 180px 88px rgba(255,25,0,.36);
}
.rock::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 38%, rgba(255,246,186,.7) 0 2%, transparent 14%),
    radial-gradient(ellipse at 70% 29%, rgba(255,194,75,.55) 0 3%, transparent 15%),
    radial-gradient(ellipse at 62% 71%, rgba(26,7,3,.78) 0 7%, transparent 14%),
    radial-gradient(ellipse at 31% 70%, rgba(45,8,2,.7) 0 6%, transparent 13%);
  mix-blend-mode: screen;
}
.rock::after {
  content: "";
  position: absolute;
  inset: 9%;
  border: 5px solid rgba(255,177,58,.62);
  border-left-color: rgba(255,245,190,.95);
  border-bottom-color: rgba(255,60,0,.14);
  border-radius: 42% 58% 47% 53%;
  transform: rotate(-28deg) scale(1.03);
  filter: blur(4px);
}
.fb, .ring, .scorch, .puff, .spark { position: absolute; border-radius: 50%; }
.fb {
  width: 230px;
  height: 230px;
  margin: -115px 0 0 -115px;
  background: radial-gradient(circle, #fff 0, #fff4bd 12%, #ffc64b 25%, #ff7119 42%, #dd2424 61%, transparent 73%);
}
.ring {
  width: 64px;
  height: 64px;
  margin: -32px 0 0 -32px;
  border: 9px solid #24201c;
  box-shadow: 0 0 25px rgba(255,140,35,.8), inset 0 0 18px rgba(255,180,45,.35);
}
.scorch {
  width: 500px;
  height: 500px;
  margin: -250px 0 0 -250px;
  background: radial-gradient(ellipse, rgba(15,8,6,.74) 0, rgba(55,20,8,.42) 34%, transparent 71%);
}
.puff {
  width: 180px;
  height: 180px;
  margin: -90px 0 0 -90px;
  background: radial-gradient(circle, rgba(42,37,34,.7), rgba(74,45,29,.32) 42%, transparent 73%);
}
.spark { width: 9px; height: 18px; border-radius: 2px; }
.flash { position: absolute; inset: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
  #legacy, #stage, .btn, #unlock-banner { transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<!-- Temporary old website shown only for the meteor impact -->
<div id="legacy" aria-hidden="true">
  <div class="legacy-list" id="legacy-list">
    <a class="btn" href="https://joelmensah.github.io/triweekly/english1">English Tri-Weekly 1</a>
    <a class="btn" href="https://joelmensah.github.io/gcse/timetable">GCSE Timetable</a>
    <a class="btn" href="https://joelmensah.github.io/hannah/kettle.html">Hannah Kettle</a>
  </div>
</div>

<!-- Sparkly banner shown during the blackout unlock sequence -->
<div id="unlock-banner" aria-hidden="true">
  <span class="unlock-title">✨ New Button Unlocked! ✨</span>
</div>

<!-- The final website revealed after the old one is destroyed -->
<main id="stage">
  <nav id="list" aria-label="Links"></nav>
</main>

<div id="warn" aria-hidden="true"><div id="vig"></div><div id="warnText">! WARNING !</div></div>
<div id="fx" aria-hidden="true"></div>

<script id="links" type="text/plain">
English Tri-Weekly 1 https://joelmensah.github.io/triweekly/english1
GCSE Timetable https://joelmensah.github.io/gcse/timetable
Hannah Kettle https://joelmensah.github.io/hannah/kettle.html
Maths: Ranked https://joelmensah.github.io/maths/1v1
</script>

<script>
(() => {
  const KEY = 'links_intro_v6';
  const $ = id => document.getElementById(id);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const body = document.body;
  const legacyList = $('legacy-list');
  const list = $('list');
  const fx = $('fx');
  let runId = 0;
  const sequenceTimers = new Set();
  let replayBuffer = '';
  let replayBufferTimer = null;
  let unlockedBtn = null;
  let activeSparkles = [];

  function later(callback, delay, token = runId) {
    const id = setTimeout(() => {
      sequenceTimers.delete(id);
      if (token === runId) callback();
    }, delay);
    sequenceTimers.add(id);
    return id;
  }

  function clearSequenceTimers() {
    for (const id of sequenceTimers) clearTimeout(id);
    sequenceTimers.clear();
  }

  function clearSparkles() {
    activeSparkles.forEach(s => s.remove());
    activeSparkles = [];
  }

  /* Build the final links */
  $('links').textContent.split('\n').forEach(line => {
    const match = line.trim().match(/^(.*?)\s+(https?:\/\/\S+)$/i);
    if (!match) return;
    const a = document.createElement('a');
    a.href = match[2];
    a.className = 'btn';
    const label = match[1].trim();
    a.textContent = label;
    if (/maths:?\s*ranked/i.test(label)) {
      a.classList.add('unlocked-btn');
      unlockedBtn = a;
    }
    list.appendChild(a);
  });

  /* Calculate how far the unlocked button needs to shift so it sits dead-center during blackout */
  function updateCenterOffset() {
    if (!unlockedBtn) return;
    const prevTransform = unlockedBtn.style.transform;
    unlockedBtn.style.transform = 'none';
    const rect = unlockedBtn.getBoundingClientRect();
    unlockedBtn.style.transform = prevTransform;
    const btnCenterY = rect.top + rect.height / 2;
    const viewportCenterY = window.innerHeight / 2;
    const offset = viewportCenterY - btnCenterY;
    unlockedBtn.style.setProperty('--center-offset', `${offset}px`);
  }

  window.addEventListener('resize', updateCenterOffset);

  function spawnUnlockSparkles() {
    clearSparkles();
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < 18; i++) {
      const star = document.createElement('div');
      star.className = 'sparkle-star';
      const rx = cx + rnd(-190, 190);
      const ry = cy + rnd(-115, 65);
      const size = rnd(8, 18);
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${rx - size / 2}px`;
      star.style.top = `${ry - size / 2}px`;
      star.style.animationDelay = `${rnd(0, 0.8)}s`;
      star.style.animationDuration = `${rnd(0.55, 1.15)}s`;
      document.body.appendChild(star);
      activeSparkles.push(star);
    }
  }

  function mk(cls, css) {
    const el = document.createElement('div');
    el.className = cls;
    if (css) el.style.cssText = css;
    fx.appendChild(el);
    return el;
  }

  function shake(el, amount, duration) {
    const frames = [{ transform: 'none' }];
    for (let i = 0; i < 12; i++) {
      frames.push({
        transform: `translate(${rnd(-amount, amount)}px, ${rnd(-amount, amount)}px) rotate(${rnd(-amount / 6, amount / 6)}deg)`
      });
    }
    frames.push({ transform: 'none' });
    el.animate(frames, { duration, easing: 'linear' });
  }

  function warning(done, token) {
    const w = $('warn');
    const t = $('warnText');
    const v = $('vig');
    w.style.display = 'block';
    const duration = 2400;
    const start = performance.now();
    (function frame(now) {
      if (token !== runId) return;
      const progress = Math.min(1, (now - start) / duration);
      const eased = Math.pow(progress, 1.55);
      const pulse = 1 + .06 * Math.sin((now - start) / 1000 * (5 + 12 * progress)) * (.4 + progress);
      t.style.opacity = .12 + .88 * eased;
      t.style.transform = `translate(-50%, -50%) scale(${(.35 + 2.1 * eased) * pulse})`;
      t.style.textShadow = `0 0 ${8 + 50 * eased}px #ff1a1a, 0 0 ${20 + 130 * eased}px #ff1a1a, 0 0 ${40 + 220 * eased}px rgba(255,0,0,.8)`;
      v.style.opacity = Math.min(1, .1 + .9 * eased * pulse);
      w.style.background = `rgba(40,0,0,${.32 * eased})`;
      if (progress < 1) requestAnimationFrame(frame);
      else {
        w.style.display = 'none';
        done();
      }
    })(start);
  }

  function meteor(cx, cy, done, token) {
    const x0 = cx - innerWidth * .88;
    const y0 = cy - innerHeight * .94;
    const angle = Math.atan2(cy - y0, cx - x0) * 180 / Math.PI;
    const m = mk('met');
    m.innerHTML = '<div class="met-in" style="--a:' + angle + 'deg"><div class="tail"></div><div class="rock"></div></div>';
    const animation = m.animate([
      { transform: `translate(${x0}px, ${y0}px) scale(.3)` },
      { transform: `translate(${cx}px, ${cy}px) scale(2.35)` }
    ], { duration: 1500, easing: 'cubic-bezier(.48, 0, .86, .46)', fill: 'forwards' });
    animation.onfinish = () => {
      m.remove();
      if (token === runId) done();
    };
  }

  function explode(cx, cy) {
    const at = `left:${cx}px;top:${cy}px;`;
    mk('scorch', at).animate([
      { transform: 'scale(.3)', opacity: .9 },
      { transform: 'scale(1.8)', opacity: 0 }
    ], { duration: 1600, easing: 'ease-out', fill: 'forwards' });
    mk('fb', at).animate([
      { transform: 'scale(.12)', opacity: 1 },
      { transform: 'scale(6.2)', opacity: 0 }
    ], { duration: 950, easing: 'ease-out', fill: 'forwards' });
    mk('ring', at).animate([
      { transform: 'scale(.7)', opacity: .95 },
      { transform: 'scale(32)', opacity: 0 }
    ], { duration: 950, easing: 'ease-out', fill: 'forwards' });
    mk('flash', `background:radial-gradient(circle at ${cx}px ${cy}px, #fff 0, rgba(255,205,100,.9) 14%, rgba(255,90,15,.65) 37%, transparent 73%)`)
      .animate([{ opacity: .98 }, { opacity: 0 }], { duration: 750, fill: 'forwards' });

    const colours = ['#ff3b30', '#ff9500', '#ffcc00', '#25201d', '#fff0bd'];
    for (let i = 0; i < 90; i++) {
      const angle = rnd(0, Math.PI * 2);
      const distance = rnd(150, Math.max(innerWidth, innerHeight) * .82);
      const colour = colours[i % colours.length];
      mk('spark', at + 'background:' + colour).animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance + 100}px) rotate(${rnd(-760, 760)}deg)`, opacity: 0 }
      ], { duration: rnd(900, 1500), easing: 'cubic-bezier(.1,.8,.3,1)', fill: 'forwards' });
    }
    shake(legacyList, 22, 500);
  }

  function revealUnlockedSequence(token) {
    updateCenterOffset();
    body.classList.add('blackout');
    spawnUnlockSparkles();

    /* Hold the glowing button and sparkling text in the middle, then move to its slot */
    later(() => {
      clearSparkles();
      body.classList.remove('blackout');
      body.classList.add('rising');
    }, 2300, token);

    later(() => fx.replaceChildren(), 4200, token);
  }

  function playFullSequence() {
    runId++;
    const token = runId;
    clearSequenceTimers();
    clearSparkles();
    if (replayBufferTimer !== null) {
      clearTimeout(replayBufferTimer);
      replayBufferTimer = null;
    }
    replayBuffer = '';

    document.getAnimations().forEach(animation => {
      try { animation.cancel(); } catch (error) {}
    });
    body.classList.add('resetting');
    void body.offsetWidth;
    body.classList.remove('legacy-view', 'blackout', 'rising');
    fx.replaceChildren();

    const warningOverlay = $('warn');
    const warningText = $('warnText');
    const vignette = $('vig');
    warningOverlay.style.display = 'none';
    warningOverlay.style.background = '';
    warningText.style.opacity = '.1';
    warningText.style.transform = 'translate(-50%, -50%) scale(.35)';
    warningText.style.textShadow = '';
    vignette.style.opacity = '0';

    updateCenterOffset();
    void body.offsetWidth;
    body.classList.remove('resetting');
    void body.offsetWidth;

    body.classList.add('legacy-view');
    later(() => {
      warning(() => {
        if (token !== runId) return;
        const rect = legacyList.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        meteor(cx, cy, () => {
          if (token !== runId) return;
          explode(cx, cy);
          later(() => {
            revealUnlockedSequence(token);
            try { localStorage.setItem(KEY, '1'); } catch (error) {}
          }, 180, token);
        }, token);
      }, token);
    }, 650, token);
  }

  let storageOK = true;
  let seen = null;
  try { seen = localStorage.getItem(KEY); } catch (error) { storageOK = false; }
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const forceIntro = /[?&]intro\b/.test(location.search);
  const playIntro = forceIntro || (storageOK && !seen && !reduceMotion);

  /* Typing "replay" anywhere on the page restarts the sequence */
  window.addEventListener('keydown', event => {
    if (event.ctrlKey || event.altKey || event.metaKey || event.key.length !== 1) return;
    replayBuffer = (replayBuffer + event.key.toLowerCase()).slice(-6);
    if (replayBuffer.endsWith('replay')) {
      replayBuffer = '';
      if (replayBufferTimer !== null) clearTimeout(replayBufferTimer);
      replayBufferTimer = null;
      playFullSequence();
      return;
    }
    if (replayBufferTimer !== null) clearTimeout(replayBufferTimer);
    replayBufferTimer = setTimeout(() => {
      replayBuffer = '';
      replayBufferTimer = null;
    }, 2500);
  });

  if (!playIntro) {
    body.classList.add('rising');
  } else {
    playFullSequence();
  }
})();
</script>
</body>
</html>
